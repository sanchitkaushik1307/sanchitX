<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sx-gradient-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="40%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#a100ff" />
    </linearGradient>
    <linearGradient id="sx-gradient-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" opacity="0.8" />
      <stop offset="100%" stop-color="#d000ff" opacity="0.8" />
    </linearGradient>
    <filter id="sx-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00d2ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circle outline with speech bubble tail -->
  <path d="M 250 40 
           A 200 200 0 1 1 160 435 
           L 155 470 
           L 195 445 
           A 200 200 0 0 1 250 40 Z" 
        fill="none" stroke="url(#sx-gradient-main)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Circuit nodes on top-left curve -->
  <g fill="none" stroke="url(#sx-gradient-main)" stroke-width="8" stroke-linecap="round">
    <!-- Node 1 -->
    <path d="M 160 110 L 100 110 L 70 140 L 40 140" />
    <circle cx="40" cy="140" r="10" fill="#00d2ff" stroke="none" />
    
    <!-- Node 2 -->
    <path d="M 185 140 L 140 140 L 105 175 L 60 175 L 45 190" />
    <circle cx="45" cy="190" r="8" fill="#00b4ff" stroke="none" />

    <!-- Node 3 -->
    <path d="M 130 170 L 110 190 L 85 190" />
    <circle cx="85" cy="190" r="6" fill="#0099ff" stroke="none" />

    <!-- Node 4 -->
    <path d="M 215 115 L 180 80 L 140 80" />
    <circle cx="140" cy="80" r="8" fill="#00d2ff" stroke="none" />
  </g>

  <!-- SX Stylized Center Logo -->
  <g filter="url(#sx-shadow)">
    <!-- Stylized 'S' -->
    <path d="M 230 190 
             L 135 190 
             C 105 190 90 205 90 230 
             C 90 255 105 270 135 270 
             L 225 270 
             C 255 270 270 285 270 310 
             C 270 335 255 350 225 350 
             L 100 350" 
          fill="none" stroke="url(#sx-gradient-main)" stroke-width="42" stroke-linecap="square" stroke-linejoin="round" />

    <!-- Sharp Diagonal 'X' Blade -->
    <path d="M 210 410 L 460 90 L 390 90 L 160 350 Z" fill="url(#sx-gradient-main)" />
    <path d="M 330 205 L 420 350 L 350 350 L 290 255 Z" fill="url(#sx-gradient-main)" />
  </g>
</svg>
